  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans Tamil', sans-serif;
      background: #fdf6ec;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #b5451b;
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #8a6d3b;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .progress-wrapper {
      position: sticky;
      top: 0;
      background: #fdf6ec;
      padding: 12px 0 16px;
      z-index: 10;
      border-bottom: 1px solid #e8c47c;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #c0392b;
      margin: 20px 0 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e8c47c;
    }

    .checklist {
      list-style: none;
    }

    .checklist li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .checklist li:hover {
      background: #fcecd5;
    }

    .checklist li input[type="checkbox"] {
      display: none;
    }

    .checklist li label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      width: 100%;
      font-size: 1.05rem;
      color: #3e2723;
      user-select: none;
    }

    .checkmark {
      width: 26px;
      height: 26px;
      border: 2px solid #c0392b;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      background: #fff;
    }

    .checkmark svg {
      width: 16px;
      height: 16px;
      stroke: #fff;
      stroke-width: 3;
      fill: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    input[type="checkbox"]:checked + label .checkmark {
      background: #c0392b;
      border-color: #c0392b;
    }

    input[type="checkbox"]:checked + label .checkmark svg {
      opacity: 1;
    }

    input[type="checkbox"]:checked + label .item-text {
      text-decoration: line-through;
      color: #999;
    }

    .item-text {
      transition: color 0.2s;
    }

    .qty {
      margin-left: auto;
      font-size: 0.85rem;
      color: #8a6d3b;
      white-space: nowrap;
    }

    .progress-bar {
      background: #ecdcc4;
      border-radius: 12px;
      height: 14px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e67e22, #c0392b);
      border-radius: 12px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .progress-text {
      text-align: center;
      margin-top: 8px;
      font-size: 0.9rem;
      color: #8a6d3b;
    }
  </style>
</head>

  <script>
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const total = checkboxes.length;
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const STORAGE_KEY = 'biryani-checklist';

    function saveState() {
      var state = {};
      checkboxes.forEach(function(cb) {
        if (cb.checked) state[cb.id] = true;
      });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
    }

    function loadState() {
      try {
        var state = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (state) {
          checkboxes.forEach(function(cb) {
            if (state[cb.id]) cb.checked = true;
          });
        }
      } catch(e) {}
    }

    function updateProgress() {
      const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
      const pct = Math.round((checked / total) * 100);
      progressFill.style.width = pct + '%';
      progressText.textContent = checked + ' / ' + total + ' பொருட்கள் தயார்';
    }

    loadState();
    updateProgress();

    checkboxes.forEach(function(cb) {
      cb.addEventListener('change', function() {
        saveState();
        updateProgress();
      });
    });
  </script>
